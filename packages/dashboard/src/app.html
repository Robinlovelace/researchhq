<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const pref = localStorage.getItem('researchhq-color-scheme');
        if (pref === 'light' || pref === 'dark') {
          document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', pref);
        }
      } catch {
        // Storage unavailable (private browsing / sandboxed context); fall back to light dark
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
